{% extends "base.html" %}
{% block body %}
<main class="login-page">
  <section class="login-card">
    <h1 class="login-title">修改密码</h1>
    {% if flash %}<div class="alert alert-{{ flash.category }}">{{ flash.message }}</div>{% endif %}
    <form method="post" action="/app/password" class="grid">
      <div class="field"><label>原密码</label><input type="password" name="old_password" required></div>
      <div class="field"><label>新密码</label><input type="password" name="new_password" minlength="6" required></div>
      <div class="actions"><button class="btn btn-primary" type="submit">保存</button><a class="btn" href="/app/evaluation">返回</a></div>
    </form>
  </section>
</main>
{% endblock %}
