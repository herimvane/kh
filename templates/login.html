{% extends "base.html" %}
{% block body %}
<main class="login-page">
  <section>
    <form class="login-card" method="post" action="/login">
      <div class="login-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" role="img">
          <path d="M24 4 8 10v12c0 10.8 6.6 18.4 16 22 9.4-3.6 16-11.2 16-22V10L24 4Z" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
          <path d="M16 22h16M18 34h12M20 22v10M24 22v10M28 22v10M15 18l9-6 9 6" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="login-title">毕节金融监管分局人事考核系统</h1>
      {% if flash %}<div class="alert alert-{{ flash.category }}">{{ flash.message }}</div>{% endif %}
      <div class="field" style="margin-bottom:12px">
        <label for="username">用户名</label>
        <div class="input-icon">
          <span aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7 8a7 7 0 0 0-14 0" /></svg>
          </span>
          <input id="username" name="username" autocomplete="username" placeholder="请输入用户名" required autofocus>
        </div>
      </div>
      <div class="field" style="margin-bottom:18px">
        <label for="password">密码</label>
        <div class="input-icon">
          <span aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 10V8a5 5 0 0 1 10 0v2M6 10h12v10H6V10Zm6 4v2" /></svg>
          </span>
          <input id="password" type="password" name="password" autocomplete="current-password" placeholder="请输入密码" required>
        </div>
      </div>
      <div class="login-options">
        <label><input type="checkbox" checked> 记住我</label>
        <a href="/login">忘记密码?</a>
      </div>
      <button class="btn btn-primary" style="width:100%" type="submit">登录</button>
    </form>
    <div class="footer">wenxianyun</div>
  </section>
</main>
{% endblock %}
